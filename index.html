
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Welcome Fireworks</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(
        ellipse at center,
        #182446 0%,
        #080d20 65%,
        #030510 100%
      );
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .welcome {
      display: flex;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      position: relative;
      z-index: 1;

      font-size: clamp(45px, 12vw, 120px);
      font-weight: bold;
      color: white;

      text-shadow:
        0 0 15px #ffffff80,
        0 0 35px #6a8cff70,
        0 0 65px #526aff50;

      transition: transform 0.2s;
    }

    .welcome:hover {
      transform: scale(1.05);
    }

    .welcome span {
      display: inline-block;
    }

    .hint {
      position: fixed;
      bottom: 50px;
      color: #94a3c0;
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="welcome" id="welcome">
    <span>W</span>
    <span>e</span>
    <span>l</span>
    <span>c</span>
    <span>o</span>
    <span>m</span>
    <span>e</span>
  </div>

  <p class="hint">Click Welcome ✨</p>

  <canvas id="fireworks"></canvas>

  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    const welcome = document.getElementById("welcome");
    const letters = welcome.querySelectorAll("span");

    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // 폭죽 색상
    const colors = [
      "#ff4d6d",
      "#ffbe0b",
      "#3a86ff",
      "#8338ec",
      "#06d6a0",
      "#ff70a6",
      "#ffffff"
    ];

    // 폭죽 입자
    class Particle {
      constructor(x, y, color, angle, speed) {
        this.x = x;
        this.y = y;

        this.color = color;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.alpha = 1;
        this.gravity = 0.045;
        this.friction = 0.98;
        this.radius = Math.random() * 2 + 1;

        this.history = [];
      }

      update() {
        this.history.push({
          x: this.x,
          y: this.y
        });

        if (this.history.length > 6) {
          this.history.shift();
        }

        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.alpha -= 0.013;
      }

      draw() {
        ctx.save();

        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.strokeStyle = this.color;
        ctx.fillStyle = this.color;

        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;

        // 빛의 꼬리
        if (this.history.length > 1) {
          ctx.beginPath();

          ctx.moveTo(
            this.history[0].x,
            this.history[0].y
          );

          for (const point of this.history) {
            ctx.lineTo(point.x, point.y);
          }

          ctx.lineWidth = this.radius;
          ctx.stroke();
        }

        // 반짝이는 입자
        ctx.beginPath();
        ctx.arc(
          this.x,
          this.y,
          this.radius,
          0,
          Math.PI * 2
        );
        ctx.fill();

        ctx.restore();
      }
    }

    // 특정 좌표에서 폭죽 터뜨리기
    function createFirework(x, y, color) {
      const count = 90;

      for (let i = 0; i < count; i++) {
        const angle =
          (Math.PI * 2 * i) / count +
          (Math.random() - 0.5) * 0.15;

        const speed = Math.random() * 5 + 2;

        particles.push(
          new Particle(
            x,
            y,
            color,
            angle,
            speed
          )
        );
      }
    }

    // Welcome 글자 클릭
    welcome.addEventListener("click", () => {

      letters.forEach((letter, index) => {

        const rect = letter.getBoundingClientRect();

        // 각 글자의 중앙 좌표
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        // 왼쪽 글자부터 순서대로 폭죽 발생
        setTimeout(() => {
          createFirework(
            x,
            y,
            colors[index % colors.length]
          );
        }, index * 80);

      });

    });

    // 애니메이션
    function animate() {
      requestAnimationFrame(animate);

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.globalCompositeOperation = "lighter";

      particles.forEach((particle, index) => {
        particle.update();
        particle.draw();

        if (particle.alpha <= 0) {
          particles.splice(index, 1);
        }
      });

      ctx.globalCompositeOperation = "source-over";
    }

    animate();
  </script>

</body>
</html>
