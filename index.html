<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Welcome Fireworks</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        background: radial-gradient(
            circle,
            #172342 0%,
            #080e1f 65%,
            #030610 100%
        );

        font-family: Arial, sans-serif;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    #welcome {
        position: relative;
        z-index: 1;

        border: none;
        background: transparent;

        font-size: clamp(48px, 12vw, 110px);
        font-weight: bold;
        color: white;

        cursor: pointer;
        user-select: none;

        text-shadow:
            0 0 18px rgba(132,166,255,0.55);
    }

    .hint {
        position: fixed;
        bottom: 40px;
        color: #9aa8c9;
        font-size: 13px;
    }
</style>
</head>

<body>

<button id="welcome">Welcome</button>

<canvas id="fireworks"></canvas>

<p class="hint">
    Welcome을 눌러보세요 ✨
</p>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
const welcome = document.getElementById("welcome");

let particles = [];
let running = false;
let previousTime = 0;

const colors = [
    "#ff718c",
    "#ffd36e",
    "#6fdcff",
    "#b6a0ff",
    "#75f3c8"
];

// 캔버스 크기 설정
function resizeCanvas() {
    const dpr = Math.min(
        window.devicePixelRatio || 1,
        1.5
    );

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

// 폭죽 생성
function createFirework() {

    const rect = welcome.getBoundingClientRect();

    // Welcome 글자의 정중앙
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    // 이전 입자 제거 (렉 방지)
    particles = [];

    // 폭죽 입자 55개
    const count = 55;

    for (let i = 0; i < count; i++) {

        const angle = Math.random() * Math.PI * 2;

        const speed = Math.random() * 3 + 1.5;

        const life = Math.random() * 20 + 35;

        particles.push({
            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            life: life,
            maxLife: life,

            color: colors[i % colors.length]
        });
    }

    if (!running) {
        running = true;
        previousTime = 0;
        requestAnimationFrame(animate);
    }
}

// 폭죽 애니메이션
function animate(time) {

    const dt = previousTime
        ? Math.min((time - previousTime) / 16.67, 2)
        : 1;

    previousTime = time;

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        // 마찰력
        p.vx *= Math.pow(0.982, dt);
        p.vy *= Math.pow(0.982, dt);

        // 중력
        p.vy += 0.035 * dt;

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.life -= dt;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.globalAlpha = p.life / p.maxLife;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;

        // 짧은 불꽃 꼬리
        ctx.beginPath();

        ctx.moveTo(
            p.x - p.vx * 2,
            p.y - p.vy * 2
        );

        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }

    ctx.globalAlpha = 1;

    // 입자가 있을 때만 애니메이션 실행
    if (particles.length > 0) {
        requestAnimationFrame(animate);
    } else {
        running = false;
        previousTime = 0;
    }
}

// Welcome 클릭 이벤트
welcome.addEventListener(
    "click",
    createFirework
);

</script>

</body>
</html>
